{% extends "base.html" %}
{% block title %}Add Tax Document - Fintoit{% endblock %}
{% block content %}
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap");
.fp{ --ink:#0a0a0f;--paper:#f7f6f2;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#d97706;--muted:#6b6b7a;--border:#e2e1db;
  font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);}
.fp .num{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;}
.fp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1.25rem;flex-wrap:wrap;margin-bottom:1.75rem;}
.fp-eyebrow{font-family:'DM Mono',monospace;font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:.5rem;}
.fp-title{font-size:clamp(1.7rem,3.5vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;}
.fp-sub{color:var(--muted);font-size:.9rem;margin:.5rem 0 0;}
.fp-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
.fp-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:10px;font-size:.83rem;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;border:1.5px solid var(--ink);text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap;}
.fp-btn-dark{background:var(--ink);color:#fff;} .fp-btn-dark:hover{background:#1e1e2e;transform:translateY(-1px);}
.fp-btn-ghost{background:#fff;color:var(--ink);} .fp-btn-ghost:hover{background:var(--paper);transform:translateY(-1px);}
.fp-card{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:1.5rem;}
.fp-stat-label{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.fp-stat-val{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.fp-stat-cap{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);margin-top:.5rem;}
.fp-table{width:100%;border-collapse:collapse;}
.fp-table thead{background:var(--ink);}
.fp-table th{padding:.8rem 1.1rem;text-align:left;font-size:.62rem;font-weight:700;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono',monospace;white-space:nowrap;}
.fp-table td{padding:.8rem 1.1rem;font-size:.88rem;border-bottom:1px solid var(--border);}
.fp-table tbody tr:last-child td{border-bottom:none;}
.fp-table tbody tr:hover td{background:var(--paper);}
.fp-label{display:block;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.fp-input,.fp-select,.fp-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:.65rem .8rem;font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);background:#fff;font-size:.9rem;box-sizing:border-box;}
.fp-input:focus,.fp-select:focus,.fp-textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,15,.06);}
.fp-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:100px;font-size:.7rem;font-weight:700;border:1.5px solid;}
.fp-empty{border:2px dashed var(--border);border-radius:20px;padding:3.5rem 2rem;text-align:center;background:var(--paper);}
.fp-empty-icon{font-size:3rem;display:block;margin-bottom:1rem;}
.fp-empty-title{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem;}
.fp-empty-sub{color:var(--muted);max-width:460px;margin:0 auto 1.5rem;line-height:1.6;}
.fp-progress{height:10px;background:var(--paper);border:1px solid var(--border);border-radius:100px;overflow:hidden;}
.fp-progress-fill{height:100%;border-radius:100px;}
</style>

<div class="fp" style="max-width:640px;margin:0 auto;">

  <div class="fp-head">
    <div>
      <div class="fp-eyebrow">Tax</div>
      <h1 class="fp-title">📁 Add Tax Document</h1>
      <p class="fp-sub">Upload and categorise a tax or compliance document</p>
    </div>
    <div class="fp-actions">
      <a href="/tax-summary" class="fp-btn fp-btn-ghost">← Back to Tax Summary</a>
    </div>
  </div>

  <div class="fp-card">
    <form method="POST" enctype="multipart/form-data" style="display:flex;flex-direction:column;gap:1.25rem;">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div>
          <label class="fp-label">Document Type</label>
          <select name="document_type" required class="fp-select">
              <option value="">Select Type</option>
              <option value="1099-NEC">1099-NEC (Non-Employee Compensation)</option>
              <option value="1099-MISC">1099-MISC (Miscellaneous)</option>
              <option value="1099-K">1099-K (Payment Card)</option>
              <option value="W-2">W-2 (Employee Wages)</option>
              <option value="W-9">W-9 (Request for TIN)</option>
              <option value="Receipt">Receipt</option>
              <option value="Invoice">Invoice</option>
              <option value="Contract">Contract</option>
              <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="fp-label">Tax Year</label>
          <select name="tax_year" required class="fp-select">
              {% for year in years %}
              <option value="{{ year }}">{{ year }}</option>
              {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label class="fp-label">Vendor / Payer Name</label>
        <input type="text" name="vendor_name" placeholder="Who issued this document?"
               class="fp-input">
      </div>

      <div>
        <label class="fp-label">Category</label>
        <select name="category" class="fp-select">
            <option value="">Select Category</option>
            <option>Software & Technology</option>
            <option>Professional Services</option>
            <option>Marketing</option>
            <option>Office & Admin</option>
            <option>Travel</option>
            <option>Equipment</option>
            <option>Revenue</option>
            <option>Other</option>
        </select>
      </div>

      <div>
        <label class="fp-label">Amount ($)</label>
        <input type="number" name="amount" step="0.01" placeholder="0.00"
               class="fp-input">
      </div>

      <div>
        <label class="fp-label">Notes</label>
        <textarea name="notes" rows="3" placeholder="Additional notes..."
                  class="fp-textarea"></textarea>
      </div>

      <!-- File Upload -->
      <div>
        <label class="fp-label">📎 Attach File <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-family:'Bricolage Grotesque',sans-serif;font-size:.8rem;">(Optional)</span></label>
        <div style="border:2px dashed var(--border);border-radius:12px;padding:2rem 1.5rem;text-align:center;cursor:pointer;background:var(--paper);transition:border-color .15s;"
             onclick="document.getElementById('fileInput').click()">
          <div id="filePreview" style="color:var(--muted);">
            <div style="font-size:2.5rem;margin-bottom:.5rem;">📄</div>
            <p style="font-size:.88rem;margin:0;">Click to upload or drag &amp; drop</p>
            <p style="font-size:.75rem;color:var(--muted);margin:.25rem 0 0;">PDF, PNG, JPG, JPEG, DOC, DOCX</p>
          </div>
          <input type="file" id="fileInput" name="document_file"
                 accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"
                 class="hidden"
                 style="display:none;"
                 onchange="showFileName(this)">
        </div>
      </div>

      <div style="display:flex;gap:.75rem;">
        <button type="submit" class="fp-btn fp-btn-dark" style="flex:1;justify-content:center;">
          💾 Save Document
        </button>
        <a href="/tax-summary" class="fp-btn fp-btn-ghost" style="flex:1;justify-content:center;">
          Cancel
        </a>
      </div>

    </form>
  </div>

</div>

<script>
function showFileName(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const preview = document.getElementById('filePreview');
        const isImage = file.type.startsWith('image/');
        const icon = file.type === 'application/pdf' ? '📕' : isImage ? '🖼️' : '📄';
        preview.innerHTML = `
            <div class="text-3xl mb-1">${icon}</div>
            <p class="text-sm font-semibold text-gray-700">${file.name}</p>
            <p class="text-xs text-gray-400">${(file.size / 1024).toFixed(1)} KB</p>
            <p class="text-xs text-blue-500 mt-1">Click to change</p>
        `;
    }
}
</script>
{% endblock %}
