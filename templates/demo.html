{% extends "base.html" %}
{% block title %}Request a Demo | Fintoit{% endblock %}
{% block content %}

<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap');

:root {
  --ink: #0a0a0f;
  --paper: #f7f6f2;
  --blue: #1d4ed8;
  --green: #16a34a;
  --red: #dc2626;
  --muted: #6b6b7a;
  --border: #e2e1db;
}

.demo-page {
  font-family: 'Bricolage Grotesque', sans-serif;
  background: var(--paper);
  min-height: 100vh;
  padding: 5rem 1.5rem;
  position: relative;
  overflow: hidden;
}

.demo-page::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.4;
}

.demo-container {
  max-width: 640px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* Flash messages */
.flash-ok {
  background: #f0fdf4;
  border: 1.5px solid #bbf7d0;
  border-radius: 10px;
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  color: #15803d;
  font-weight: 600;
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.flash-err {
  background: #fef2f2;
  border: 1.5px solid #fecaca;
  border-radius: 10px;
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  color: var(--red);
  font-weight: 600;
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Success state */
.success-box {
  background: white;
  border: 2px solid var(--ink);
  border-radius: 24px;
  padding: 3rem;
  box-shadow: 8px 8px 0 var(--ink);
  text-align: center;
}

.success-icon {
  width: 64px;
  height: 64px;
  background: var(--ink);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.75rem;
  margin: 0 auto 1.5rem;
}

.demo-card {
  background: white;
  border: 2px solid var(--ink);
  border-radius: 24px;
  padding: 3rem;
  box-shadow: 8px 8px 0 var(--ink);
}

.demo-title {
  font-size: 2.25rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-bottom: 0.5rem;
  line-height: 1.1;
}

.demo-sub {
  color: var(--muted);
  font-size: 0.95rem;
  margin-bottom: 2rem;
  line-height: 1.65;
}

.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--ink);
  display: block;
  margin-bottom: 0.38rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-family: 'DM Mono', monospace;
}

.form-label .opt {
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  color: var(--muted);
  font-family: 'Bricolage Grotesque', sans-serif;
}

.form-input,
.form-textarea {
  width: 100%;
  padding: 0.78rem 0.9rem;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  font-size: 0.925rem;
  font-family: 'Bricolage Grotesque', sans-serif;
  color: var(--ink);
  background: var(--paper);
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
  box-sizing: border-box;
  outline: none;
}

.form-input:focus,
.form-textarea:focus {
  border-color: var(--ink);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(10, 10, 15, 0.06);
}

.form-input::placeholder,
.form-textarea::placeholder {
  color: #a1a1aa;
}

.form-textarea {
  min-height: 120px;
  resize: vertical;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

@media (max-width: 560px) {
  .form-row { grid-template-columns: 1fr; }
  .demo-card { padding: 2rem 1.5rem; }
}

.submit-btn {
  width: 100%;
  margin-top: 0.5rem;
  background: var(--ink);
  color: white;
  border: none;
  padding: 0.925rem;
  border-radius: 12px;
  font-weight: 700;
  font-size: 1rem;
  font-family: 'Bricolage Grotesque', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
}

.submit-btn:hover {
  background: #1e1e2e;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(10, 10, 15, 0.25);
}

.submit-btn:active {
  transform: translateY(0);
}

.demo-note {
  font-size: 0.72rem;
  color: var(--muted);
  text-align: center;
  margin-top: 1rem;
  font-family: 'DM Mono', monospace;
  line-height: 1.6;
}
</style>
