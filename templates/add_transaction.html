{% extends "base.html" %}

{% block title %}Add Transaction - Fintoit{% endblock %}

{% block content %}
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap");
.fp{ --ink:#0a0a0f;--paper:#f7f6f2;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#d97706;--muted:#6b6b7a;--border:#e2e1db;
  font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);}
.fp .num{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;}
.fp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1.25rem;flex-wrap:wrap;margin-bottom:1.75rem;}
.fp-eyebrow{font-family:'DM Mono',monospace;font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:.5rem;}
.fp-title{font-size:clamp(1.7rem,3.5vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;}
.fp-sub{color:var(--muted);font-size:.9rem;margin:.5rem 0 0;}
.fp-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
.fp-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:10px;font-size:.83rem;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;border:1.5px solid var(--ink);text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap;}
.fp-btn-dark{background:var(--ink);color:#fff;} .fp-btn-dark:hover{background:#1e1e2e;transform:translateY(-1px);}
.fp-btn-ghost{background:#fff;color:var(--ink);} .fp-btn-ghost:hover{background:var(--paper);transform:translateY(-1px);}
.fp-card{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:1.5rem;}
.fp-stat-label{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.fp-stat-val{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.fp-stat-cap{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);margin-top:.5rem;}
.fp-table{width:100%;border-collapse:collapse;}
.fp-table thead{background:var(--ink);}
.fp-table th{padding:.8rem 1.1rem;text-align:left;font-size:.62rem;font-weight:700;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono',monospace;white-space:nowrap;}
.fp-table td{padding:.8rem 1.1rem;font-size:.88rem;border-bottom:1px solid var(--border);}
.fp-table tbody tr:last-child td{border-bottom:none;}
.fp-table tbody tr:hover td{background:var(--paper);}
.fp-label{display:block;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.fp-input,.fp-select,.fp-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:.65rem .8rem;font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);background:#fff;font-size:.9rem;box-sizing:border-box;}
.fp-input:focus,.fp-select:focus,.fp-textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,15,.06);}
.fp-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:100px;font-size:.7rem;font-weight:700;border:1.5px solid;}
.fp-empty{border:2px dashed var(--border);border-radius:20px;padding:3.5rem 2rem;text-align:center;background:var(--paper);}
.fp-empty-icon{font-size:3rem;display:block;margin-bottom:1rem;}
.fp-empty-title{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem;}
.fp-empty-sub{color:var(--muted);max-width:460px;margin:0 auto 1.5rem;line-height:1.6;}
.fp-progress{height:10px;background:var(--paper);border:1px solid var(--border);border-radius:100px;overflow:hidden;}
.fp-progress-fill{height:100%;border-radius:100px;}
</style>

<div class="fp" style="max-width:40rem;margin:0 auto;">

    <!-- Page header -->
    <div class="fp-head">
        <div>
            <div class="fp-eyebrow">Transactions</div>
            <h1 class="fp-title">Add Transaction</h1>
            <p class="fp-sub">Record a new income or expense entry.</p>
        </div>
        <div class="fp-actions">
            <a href="/transactions" class="fp-btn fp-btn-ghost">← Back to Transactions</a>
        </div>
    </div>

    <!-- Form card -->
    <div class="fp-card">
        <form method="POST">

            <!-- Date -->
            <div style="margin-bottom:1.1rem;">
                <label for="date" class="fp-label">Date</label>
                <input type="date" id="date" name="date" required
                       class="fp-input">
            </div>

            <!-- Type -->
            <div style="margin-bottom:1.1rem;">
                <label for="type" class="fp-label">Type</label>
                <select id="type" name="type" required
                        class="fp-select">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>

            <!-- Description — triggers AI categorization -->
            <div style="margin-bottom:1.1rem;">
                <label for="description" class="fp-label">
                    Description
                    <span style="color:var(--muted);font-weight:400;margin-left:.25rem;">(AI will suggest a category as you type)</span>
                </label>
                <textarea id="description" name="description" rows="2"
                          placeholder="e.g. Monthly AWS bill, Stripe payment processing fee, Client invoice payment..."
                          class="fp-textarea"></textarea>
            </div>

            <!-- Category — auto-filled by AI -->
            <div style="margin-bottom:1.1rem;">
                <label for="category" class="fp-label">Category</label>
                <div style="position:relative;">
                    <input type="text" id="category" name="category"
                           placeholder="Type or let AI suggest..."
                           required
                           class="fp-input"
                           style="padding-right:5rem;">
                    <div id="aiCategoryBadge"
                         class="hidden"
                         style="position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:#f3e8ff;color:#7c3aed;font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:100px;border:1.5px solid #c4b5fd;">
                        🤖 AI
                    </div>
                </div>
                <!-- AI suggestion chips -->
                <div id="categorySuggestions" class="hidden" style="margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.4rem;"></div>
                <div id="aiStatus" class="text-xs text-gray-400 mt-1 hidden">
                    <span class="animate-pulse">🤖 Suggesting category...</span>
                </div>
            </div>

            <!-- Amount -->
            <div style="margin-bottom:1.1rem;">
                <label for="amount" class="fp-label">Amount ($)</label>
                <input type="number" id="amount" name="amount" step="0.01" min="0"
                       placeholder="0.00" required
                       class="fp-input">
            </div>

            <!-- Recurring -->
            <div style="margin-bottom:1.1rem;">
                <label style="display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;">
                    <input type="checkbox" name="recurring" id="recurringCheck"
                        class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <span style="font-size:.9rem;font-weight:600;color:var(--ink);">This is a recurring transaction</span>
                </label>
            </div>

            <!-- Frequency (hidden until recurring checked) -->
            <div id="frequencySection" class="hidden" style="margin-bottom:1.5rem;background:var(--paper);border:1.5px solid var(--border);border-radius:14px;padding:1.1rem;">
                <label class="fp-label" style="margin-bottom:.75rem;">How often does this repeat?</label>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;">
                    <label style="cursor:pointer;">
                        <input type="radio" name="recurring_frequency" value="weekly" class="sr-only peer">
                        <div style="text-align:center;padding:.85rem .5rem;border:2px solid var(--border);border-radius:12px;background:#fff;transition:all .15s;"
                             class="peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:border-gray-300">
                            <div style="font-size:1.6rem;margin-bottom:.3rem;">📅</div>
                            <div style="font-size:.82rem;font-weight:700;color:var(--ink);">Weekly</div>
                            <div style="font-size:.72rem;color:var(--muted);">Same day each week</div>
                        </div>
                    </label>
                    <label style="cursor:pointer;">
                        <input type="radio" name="recurring_frequency" value="monthly" class="sr-only peer" checked>
                        <div style="text-align:center;padding:.85rem .5rem;border:2px solid var(--border);border-radius:12px;background:#fff;transition:all .15s;"
                             class="peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:border-gray-300">
                            <div style="font-size:1.6rem;margin-bottom:.3rem;">🗓️</div>
                            <div style="font-size:.82rem;font-weight:700;color:var(--ink);">Monthly</div>
                            <div style="font-size:.72rem;color:var(--muted);">Same date each month</div>
                        </div>
                    </label>
                    <label style="cursor:pointer;">
                        <input type="radio" name="recurring_frequency" value="yearly" class="sr-only peer">
                        <div style="text-align:center;padding:.85rem .5rem;border:2px solid var(--border);border-radius:12px;background:#fff;transition:all .15s;"
                             class="peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:border-gray-300">
                            <div style="font-size:1.6rem;margin-bottom:.3rem;">📆</div>
                            <div style="font-size:.82rem;font-weight:700;color:var(--ink);">Yearly</div>
                            <div style="font-size:.72rem;color:var(--muted);">Same date each year</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Action buttons -->
            <div style="display:flex;gap:.75rem;">
                <button type="submit"
                        class="fp-btn fp-btn-dark"
                        style="flex:1;justify-content:center;padding:.75rem 1rem;">
                    Add Transaction
                </button>
                <a href="/transactions"
                   class="fp-btn fp-btn-ghost"
                   style="flex:1;justify-content:center;padding:.75rem 1rem;">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</div>

<script>
let debounceTimer = null;
let lastDescription = '';
let aiSuggested = false;

const descriptionEl = document.getElementById('description');
const categoryEl = document.getElementById('category');
const statusEl = document.getElementById('aiStatus');
const badgeEl = document.getElementById('aiCategoryBadge');
const suggestionsEl = document.getElementById('categorySuggestions');
const typeEl = document.getElementById('type');

// Common category suggestions for quick manual selection
const expenseCategories = ['Salaries', 'Software', 'Marketing', 'Office', 'Travel', 'Equipment', 'Professional Services', 'Utilities', 'Insurance', 'Taxes', 'Other'];
const incomeCategories = ['Sales', 'Services', 'Investment', 'Grant', 'Refund', 'Other'];

function showChips(categories) {
    suggestionsEl.innerHTML = '';
    categories.slice(0, 5).forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = cat;
        btn.className = 'text-xs bg-gray-100 text-gray-600 hover:bg-blue-100 hover:text-blue-700 border border-gray-200 px-2 py-1 rounded-full transition';
        btn.onclick = () => {
            categoryEl.value = cat;
            badgeEl.classList.add('hidden');
            aiSuggested = false;
        };
        suggestionsEl.appendChild(btn);
    });
    suggestionsEl.classList.remove('hidden');
}

// Show chips when category field is focused
categoryEl.addEventListener('focus', () => {
    const cats = typeEl.value === 'income' ? incomeCategories : expenseCategories;
    showChips(cats);
});

categoryEl.addEventListener('blur', () => {
    setTimeout(() => suggestionsEl.classList.add('hidden'), 200);
});

// When user manually edits category, hide AI badge
categoryEl.addEventListener('input', () => {
    badgeEl.classList.add('hidden');
    aiSuggested = false;
});

// Trigger AI suggestion when description changes
descriptionEl.addEventListener('input', () => {
    const desc = descriptionEl.value.trim();

    // Clear previous timer
    clearTimeout(debounceTimer);

    if (desc.length < 5) {
        statusEl.classList.add('hidden');
        return;
    }

    if (desc === lastDescription) return;

    // Show loading after 500ms debounce
    debounceTimer = setTimeout(async () => {
        lastDescription = desc;
        statusEl.classList.remove('hidden');
        badgeEl.classList.add('hidden');

        try {
            const res = await fetch('/ai-categorize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    description: desc,
                    type: typeEl.value
                })
            });
            const data = await res.json();
            statusEl.classList.add('hidden');

            if (data.category && data.category.length > 0) {
                categoryEl.value = data.category;
                badgeEl.classList.remove('hidden');
                aiSuggested = true;

                // Flash the category field
                categoryEl.classList.add('ring-2', 'ring-purple-400', 'border-purple-400');
                setTimeout(() => {
                    categoryEl.classList.remove('ring-2', 'ring-purple-400', 'border-purple-400');
                }, 1500);
            }
        } catch (e) {
            statusEl.classList.add('hidden');
        }
    }, 600);
});

// Set today's date by default
const today = new Date().toISOString().split('T')[0];
document.getElementById('date').value = today;

// Show/hide frequency when recurring checkbox changes
document.getElementById('recurringCheck').addEventListener('change', function() {
    const section = document.getElementById('frequencySection');
    if (this.checked) {
        section.classList.remove('hidden');
    } else {
        section.classList.add('hidden');
    }
});
</script>
{% endblock %}
