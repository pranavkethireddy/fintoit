{% extends "base.html" %}
{% block title %}AI Chat — Fintoit{% endblock %}

{% block content %}
<style>
@import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap");
.fp{ --ink:#0a0a0f;--paper:#f7f6f2;--blue:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#d97706;--muted:#6b6b7a;--border:#e2e1db;
  font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);}
.fp .num{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;}
.fp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1.25rem;flex-wrap:wrap;margin-bottom:1.75rem;}
.fp-eyebrow{font-family:'DM Mono',monospace;font-size:.7rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:.5rem;}
.fp-title{font-size:clamp(1.7rem,3.5vw,2.3rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;}
.fp-sub{color:var(--muted);font-size:.9rem;margin:.5rem 0 0;}
.fp-actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;}
.fp-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:10px;font-size:.83rem;font-weight:700;font-family:'Bricolage Grotesque',sans-serif;border:1.5px solid var(--ink);text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap;}
.fp-btn-dark{background:var(--ink);color:#fff;} .fp-btn-dark:hover{background:#1e1e2e;transform:translateY(-1px);}
.fp-btn-ghost{background:#fff;color:var(--ink);} .fp-btn-ghost:hover{background:var(--paper);transform:translateY(-1px);}
.fp-card{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:1.5rem;}
.fp-stat-label{font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;}
.fp-stat-val{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1;}
.fp-stat-cap{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);margin-top:.5rem;}
.fp-table{width:100%;border-collapse:collapse;}
.fp-table thead{background:var(--ink);}
.fp-table th{padding:.8rem 1.1rem;text-align:left;font-size:.62rem;font-weight:700;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono',monospace;white-space:nowrap;}
.fp-table td{padding:.8rem 1.1rem;font-size:.88rem;border-bottom:1px solid var(--border);}
.fp-table tbody tr:last-child td{border-bottom:none;}
.fp-table tbody tr:hover td{background:var(--paper);}
.fp-label{display:block;font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
.fp-input,.fp-select,.fp-textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:.65rem .8rem;font-family:'Bricolage Grotesque',sans-serif;color:var(--ink);background:#fff;font-size:.9rem;box-sizing:border-box;}
.fp-input:focus,.fp-select:focus,.fp-textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,10,15,.06);}
.fp-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:100px;font-size:.7rem;font-weight:700;border:1.5px solid;}
.fp-empty{border:2px dashed var(--border);border-radius:20px;padding:3.5rem 2rem;text-align:center;background:var(--paper);}
.fp-empty-icon{font-size:3rem;display:block;margin-bottom:1rem;}
.fp-empty-title{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.5rem;}
.fp-empty-sub{color:var(--muted);max-width:460px;margin:0 auto 1.5rem;line-height:1.6;}
.fp-progress{height:10px;background:var(--paper);border:1px solid var(--border);border-radius:100px;overflow:hidden;}
.fp-progress-fill{height:100%;border-radius:100px;}
</style>

<div class="fp" style="max-width:48rem;margin:0 auto;padding:2.5rem 1rem;">

    <!-- Header -->
    <div class="fp-head">
        <div>
            <div class="fp-eyebrow">AI</div>
            <h1 class="fp-title">🤖 AI CFO Assistant</h1>
            <p class="fp-sub">Ask anything about your finances, runway, burn, and growth.</p>
        </div>
        <div class="fp-actions">
            <button onclick="clearChat()" class="fp-btn fp-btn-ghost">Clear conversation</button>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="fp-card" style="padding:0;display:flex;flex-direction:column;height:600px;">

        <!-- Messages -->
        <div id="chatMessages" class="flex-1" style="flex:1;overflow-y:auto;padding:1.25rem;display:flex;flex-direction:column;gap:.75rem;">
            <div style="color:var(--muted);font-size:.85rem;">Loading chat...</div>
        </div>

        <!-- Suggestions -->
        <div id="suggestions" style="padding:.75rem 1.25rem .5rem;display:flex;flex-wrap:wrap;gap:.5rem;border-top:1.5px solid var(--border);">
            <button onclick="sendSuggestion('What is my runway?')" class="fp-btn fp-btn-ghost" style="font-size:.72rem;padding:.3rem .75rem;border-radius:100px;">Runway</button>
            <button onclick="sendSuggestion('Where am I spending the most?')" class="fp-btn fp-btn-ghost" style="font-size:.72rem;padding:.3rem .75rem;border-radius:100px;">Top spending</button>
            <button onclick="sendSuggestion('How is my revenue trending?')" class="fp-btn fp-btn-ghost" style="font-size:.72rem;padding:.3rem .75rem;border-radius:100px;">Revenue trend</button>
            <button onclick="sendSuggestion('Give me a financial health summary')" class="fp-btn fp-btn-ghost" style="font-size:.72rem;padding:.3rem .75rem;border-radius:100px;">Health summary</button>
        </div>

        <!-- Input -->
        <div style="border-top:1.5px solid var(--border);padding:.875rem 1.25rem;display:flex;gap:.6rem;align-items:center;">
            <input id="chatInput" type="text"
                   placeholder="Ask about your finances..."
                   class="fp-input"
                   style="border-radius:100px;flex:1;width:auto;"
                   onkeydown="if(event.key==='Enter') sendMessage()">

            <button onclick="sendMessage()"
                    class="fp-btn fp-btn-dark"
                    style="border-radius:100px;width:2.5rem;height:2.5rem;padding:0;justify-content:center;flex-shrink:0;">
                ➤
            </button>
        </div>
    </div>

</div>

<script>
// Load chat history
async function loadChatHistory() {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '<div class="text-gray-400 text-sm">Loading...</div>';

    try {
        const res = await fetch('/ai-chat/history');
        const data = await res.json();

        container.innerHTML = '';

        if (!data.history || !data.history.length) {
            appendMessage('assistant', "Hi! I'm your AI CFO assistant. Ask me anything about your finances.");
        } else {
            data.history.forEach(msg => {
                appendMessage(msg.role, msg.content);
            });
        }

        container.scrollTop = container.scrollHeight;

    } catch (err) {
        container.innerHTML = '<div class="text-red-500 text-sm">Failed to load chat.</div>';
    }
}

// Append message
function appendMessage(role, text) {
    const container = document.getElementById('chatMessages');
    const isUser = role === 'user';

    const div = document.createElement('div');
    div.className = `flex ${isUser ? 'justify-end' : 'gap-2'}`;

    div.innerHTML = isUser
        ? `<div class="bg-purple-600 text-white px-4 py-2 rounded-2xl rounded-br-none max-w-xs text-sm">${text}</div>`
        : `<span>🤖</span>
           <div class="bg-gray-100 text-gray-800 px-4 py-2 rounded-2xl rounded-bl-none max-w-xs text-sm">${text}</div>`;

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// Send message
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();

    if (!message) return;

    input.value = '';
    document.getElementById('suggestions').classList.add('hidden');

    appendMessage('user', message);

    // Typing indicator
    const typing = document.createElement('div');
    typing.id = 'typing';
    typing.innerHTML = `<div class="text-gray-400 text-sm">🤖 Thinking...</div>`;
    document.getElementById('chatMessages').appendChild(typing);

    try {
        const res = await fetch('/ai-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });

        const data = await res.json();

        document.getElementById('typing')?.remove();
        appendMessage('assistant', data.reply);

    } catch (err) {
        document.getElementById('typing')?.remove();
        appendMessage('assistant', 'Connection error. Try again.');
    }
}

// Suggestions
function sendSuggestion(text) {
    document.getElementById('chatInput').value = text;
    sendMessage();
}

// Clear chat
function clearChat() {
    fetch('/ai-chat-clear', { method: 'POST' }).then(() => {
        document.getElementById('chatMessages').innerHTML = '';
        appendMessage('assistant', "Chat cleared. Ask me anything!");
    });
}

// Init
loadChatHistory();
</script>

{% endblock %}
