<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600"
     viewBox="0 0 1400 600" role="img"
     aria-label="The four numbers every monthly investor update needs: MRR, net burn, cash and runway">
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'BricolageSub';
        font-weight: 800;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'DMMonoSub';
        font-weight: 500;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .eyebrow { font-family:'DMMonoSub',monospace; font-size:27px; font-weight:500;
                 letter-spacing:5.4px; fill:#1d4ed8; }
      .h1      { font-family:'BricolageSub',sans-serif; font-size:112px; font-weight:800;
                 letter-spacing:-2px; fill:#0a0a0f; }
      .formula { font-family:'DMMonoSub',monospace; font-size:29px; font-weight:500; fill:#6b6b7a; }
      .formula tspan.k { fill:#0a0a0f; }
      .num     { font-family:'DMMonoSub',monospace; font-size:23px; font-weight:500;
                 fill:#1d4ed8; opacity:0.75; }
      .label   { font-family:'BricolageSub',sans-serif; font-size:44px; font-weight:800;
                 letter-spacing:-0.9px; fill:#0a0a0f; }
      .mark    { font-family:'DMMonoSub',monospace; font-size:25px; font-weight:500;
                 letter-spacing:4px; fill:#6b6b7a; text-anchor:end; }
      .mark tspan.k { fill:#0a0a0f; }
    ]]></style>

    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#e2e1db" stroke-width="1"/>
    </pattern>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4f7ffa"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f5f8ff"/>
      <stop offset="100%" stop-color="#e5edfd"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="600" fill="#ffffff"/>
  <rect width="1400" height="600" fill="url(#grid)" opacity="0.34"/>

  <text class="eyebrow" x="92" y="137">MONTHLY INVESTOR UPDATE</text>
  <text class="h1" x="92" y="255">The four</text>
  <text class="h1" x="92" y="362">numbers</text>
  <rect x="92" y="410" width="132" height="7" rx="3.5" fill="#0a0a0f"/>
  <text class="formula" x="92" y="482">runway = <tspan class="k">cash</tspan> &#247; <tspan class="k">net burn</tspan></text>

  <g>
    <rect x="765" y="105" width="270" height="183" rx="22"
          fill="url(#cardGrad)" stroke="#cddcfb" stroke-width="2.5"/>
    <text class="num" x="793" y="157">01</text>
    <text class="label" x="793" y="222">MRR</text>
    <rect x="793" y="242" width="175" height="9" rx="4.5"
          fill="#1d4ed8" opacity="0.30"/>
  </g>
  <g>
    <rect x="1057" y="105" width="270" height="183" rx="22"
          fill="url(#cardGrad)" stroke="#cddcfb" stroke-width="2.5"/>
    <text class="num" x="1085" y="157">02</text>
    <text class="label" x="1085" y="222">Net burn</text>
    <rect x="1085" y="242" width="94" height="9" rx="4.5"
          fill="#1d4ed8" opacity="0.30"/>
  </g>
  <g>
    <rect x="765" y="310" width="270" height="183" rx="22"
          fill="url(#cardGrad)" stroke="#cddcfb" stroke-width="2.5"/>
    <text class="num" x="793" y="362">03</text>
    <text class="label" x="793" y="427">Cash</text>
    <rect x="793" y="447" width="141" height="9" rx="4.5"
          fill="#1d4ed8" opacity="0.30"/>
  </g>
  <g>
    <rect x="1057" y="310" width="270" height="183" rx="22"
          fill="url(#cardGrad)" stroke="#cddcfb" stroke-width="2.5"/>
    <text class="num" x="1085" y="362">04</text>
    <text class="label" x="1085" y="427">Runway</text>
    <rect x="1085" y="447" width="124" height="9" rx="4.5"
          fill="#1d4ed8" opacity="0.30"/>
  </g>

  <text class="mark" x="1324" y="548"><tspan class="k">FINTOIT</tspan> &#183; BLOG</text>

  <rect x="0" y="0" width="18" height="600" fill="url(#spine)"/>
</svg>
