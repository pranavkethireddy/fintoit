<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600"
     viewBox="0 0 1400 600" role="img"
     aria-label="Working a seed round size backwards from burn and milestone: the invented example Cedarline arrives at $1.5M against a $3.7M median priced seed">
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'BricolageSub';
        font-weight: 800;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'DMMonoSub';
        font-weight: 500;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .eyebrow  { font-family:'DMMonoSub',monospace; font-size:27px; font-weight:500;
                  letter-spacing:5.4px; fill:#1d4ed8; }
      .h1       { font-family:'BricolageSub',sans-serif; font-size:84px; font-weight:800;
                  letter-spacing:-2px; fill:#0a0a0f; }
      .fig      { font-family:'BricolageSub',sans-serif; font-size:84px; font-weight:800;
                  letter-spacing:-1.4px; }
      .fig.mine { fill:#1d4ed8; }
      .fig.mkt  { fill:#6b6b7a; opacity:0.62; }
      .figlbl   { font-family:'DMMonoSub',monospace; font-size:18px; font-weight:500;
                  letter-spacing:2.6px; fill:#6b6b7a; }
      .stackhd  { font-family:'DMMonoSub',monospace; font-size:20px; font-weight:500;
                  letter-spacing:3.4px; fill:#6b6b7a; }
      .step     { font-family:'DMMonoSub',monospace; font-size:20px; font-weight:500;
                  fill:#1d4ed8; opacity:0.7; }
      .rowlbl   { font-family:'BricolageSub',sans-serif; font-size:34px; font-weight:800;
                  letter-spacing:-0.7px; fill:#0a0a0f; }
      .rowsub   { font-family:'DMMonoSub',monospace; font-size:19px; font-weight:500;
                  fill:#6b6b7a; }
      .rowval   { font-family:'DMMonoSub',monospace; font-size:30px; font-weight:500;
                  fill:#0a0a0f; text-anchor:end; }
      .rowval.final { fill:#1d4ed8; }
      .roundsto { font-family:'DMMonoSub',monospace; font-size:22px; font-weight:500;
                  letter-spacing:3px; fill:#1d4ed8; text-anchor:end; }
      .mark     { font-family:'DMMonoSub',monospace; font-size:25px; font-weight:500;
                  letter-spacing:4px; fill:#6b6b7a; }
      .mark tspan.k { fill:#0a0a0f; }
    ]]></style>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#e2e1db" stroke-width="1"/>
    </pattern>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4f7ffa"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="600" fill="#ffffff"/>
  <rect width="1400" height="600" fill="url(#grid)" opacity="0.34"/>

  <text class="eyebrow" x="92" y="130">HOW MUCH TO RAISE</text>
  <text class="h1" x="92" y="240">Your number,</text>
  <text class="h1" x="92" y="332">not theirs</text>
  <rect x="92" y="378" width="132" height="7" rx="3.5" fill="#0a0a0f"/>

  <text class="figlbl" x="92" y="444">CEDARLINE&#39;S NUMBER</text>
  <text class="fig mine" x="92" y="520">$1.5M</text>
  <text class="figlbl" x="400" y="444">MEDIAN PRICED SEED</text>
  <text class="fig mkt" x="400" y="520">$3.7M</text>
  <text class="mark" x="92" y="580"><tspan class="k">FINTOIT</tspan> · BLOG</text>

  <rect x="700" y="86" width="1.5" height="474" fill="#e2e1db"/>

  <text class="stackhd" x="744" y="122">CEDARLINE · INVENTED EXAMPLE</text>
  <g>
    <text class="step" x="744" y="186">01</text>
    <text class="rowlbl" x="806" y="186">Cash at close</text>
    <text class="rowsub" x="806" y="214">$310,000 − 6 × $41,000</text>
    <text class="rowval" x="1322" y="186">$64,000</text>
    <rect x="806" y="236" width="516" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="step" x="744" y="274">02</text>
    <text class="rowlbl" x="806" y="274">Runway needed</text>
    <text class="rowsub" x="806" y="302">18 months to the milestone + 6 to raise</text>
    <text class="rowval" x="1322" y="274">24 months</text>
    <rect x="806" y="324" width="516" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="step" x="744" y="362">03</text>
    <text class="rowlbl" x="806" y="362">Cost of 24 months</text>
    <text class="rowsub" x="806" y="390">24 × $62,000 average net burn</text>
    <text class="rowval" x="1322" y="362">$1,488,000</text>
    <rect x="806" y="412" width="516" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="step" x="744" y="450">04</text>
    <text class="rowlbl" x="806" y="450">Round size</text>
    <text class="rowsub" x="806" y="478">less the cash left at close</text>
    <text class="rowval final" x="1322" y="450">$1,424,000</text>
  </g>

  <rect x="806" y="500" width="516" height="2.5" rx="1.25" fill="#0a0a0f" opacity="0.9"/>
  <text class="roundsto" x="1322" y="542">ROUNDS TO $1.5M</text>

  <rect x="0" y="0" width="18" height="600" fill="url(#spine)"/>
</svg>
