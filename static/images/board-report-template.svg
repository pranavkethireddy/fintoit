<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600"
     viewBox="0 0 1400 600" role="img"
     aria-label="The blank board report template rendered as a structure: a by the numbers block with empty fields for revenue, net burn, cash on hand, runway and a stage metric, above the what changed, what is not working, what is next and ask sections">
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'BricolageSub';
        font-weight: 800;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      @font-face {
        font-family: 'DMMonoSub';
        font-weight: 500;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .eyebrow  { font-family:'DMMonoSub',monospace; font-size:27px; font-weight:500;
                  letter-spacing:5.4px; fill:#1d4ed8; }
      .h1       { font-family:'BricolageSub',sans-serif; font-size:112px; font-weight:800;
                  letter-spacing:-2px; fill:#0a0a0f; }
      .formula  { font-family:'DMMonoSub',monospace; font-size:29px; font-weight:500; fill:#6b6b7a; }
      .formula tspan.k { fill:#0a0a0f; }
      .stackhd  { font-family:'DMMonoSub',monospace; font-size:20px; font-weight:500;
                  letter-spacing:3.4px; fill:#6b6b7a; }
      .blocklbl { font-family:'BricolageSub',sans-serif; font-size:30px; font-weight:800;
                  letter-spacing:-0.6px; fill:#0a0a0f; }
      .colhd    { font-family:'DMMonoSub',monospace; font-size:12px; font-weight:500;
                  letter-spacing:1.2px; fill:#6b6b7a; text-anchor:middle; }
      .rowlbl   { font-family:'DMMonoSub',monospace; font-size:18px; font-weight:500; fill:#0a0a0f; }
      .seclbl   { font-family:'DMMonoSub',monospace; font-size:18px; font-weight:500;
                  letter-spacing:1px; fill:#6b6b7a; }
      .seclbl.ask { fill:#1d4ed8; }
      .field    { fill:#1d4ed8; opacity:0.10; }
      .mark     { font-family:'DMMonoSub',monospace; font-size:25px; font-weight:500;
                  letter-spacing:4px; fill:#6b6b7a; }
      .mark tspan.k { fill:#0a0a0f; }
    ]]></style>

    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#e2e1db" stroke-width="1"/>
    </pattern>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4f7ffa"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="600" fill="#ffffff"/>
  <rect width="1400" height="600" fill="url(#grid)" opacity="0.34"/>

  <text class="eyebrow" x="92" y="137">BOARD REPORT TEMPLATE</text>
  <text class="h1" x="92" y="255">Fill in</text>
  <text class="h1" x="92" y="362">the blanks</text>
  <rect x="92" y="410" width="132" height="7" rx="3.5" fill="#0a0a0f"/>
  <text class="formula" x="92" y="482"><tspan class="k">1 blank</tspan> + <tspan class="k">2 filled</tspan> examples</text>
  <text class="mark" x="92" y="560"><tspan class="k">FINTOIT</tspan> &#183; BLOG</text>

  <rect x="700" y="86" width="1.5" height="474" fill="#e2e1db"/>

  <text class="stackhd" x="744" y="116">THE TEMPLATE &#183; BLANK</text>
  <text class="blocklbl" x="744" y="170">BY THE NUMBERS</text>
  <text class="colhd" x="1058" y="196">THIS MONTH</text>
  <text class="colhd" x="1166" y="196">LAST MONTH</text>
  <text class="colhd" x="1274" y="196">CHANGE</text>
  <g>
    <text class="rowlbl" x="744" y="228">[Revenue]</text>
    <rect class="field" x="1010" y="219" width="96" height="10" rx="5"/>
    <rect class="field" x="1118" y="219" width="96" height="10" rx="5"/>
    <rect class="field" x="1226" y="219" width="96" height="10" rx="5"/>
    <rect x="744" y="247" width="578" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="rowlbl" x="744" y="266">Net burn</text>
    <rect class="field" x="1010" y="257" width="96" height="10" rx="5"/>
    <rect class="field" x="1118" y="257" width="96" height="10" rx="5"/>
    <rect class="field" x="1226" y="257" width="96" height="10" rx="5"/>
    <rect x="744" y="285" width="578" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="rowlbl" x="744" y="304">Cash on hand</text>
    <rect class="field" x="1010" y="295" width="96" height="10" rx="5"/>
    <rect class="field" x="1118" y="295" width="96" height="10" rx="5"/>
    <rect class="field" x="1226" y="295" width="96" height="10" rx="5"/>
    <rect x="744" y="323" width="578" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="rowlbl" x="744" y="342">Runway</text>
    <rect class="field" x="1010" y="333" width="96" height="10" rx="5"/>
    <rect class="field" x="1118" y="333" width="96" height="10" rx="5"/>
    <rect class="field" x="1226" y="333" width="96" height="10" rx="5"/>
    <rect x="744" y="361" width="578" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="rowlbl" x="744" y="380">[Stage metric]</text>
    <rect class="field" x="1010" y="371" width="96" height="10" rx="5"/>
    <rect class="field" x="1118" y="371" width="96" height="10" rx="5"/>
    <rect class="field" x="1226" y="371" width="96" height="10" rx="5"/>
    <rect x="744" y="399" width="578" height="1" fill="#e2e1db"/>
  </g>
  <g>
    <text class="seclbl" x="744" y="436">WHAT CHANGED</text>
    <rect x="1000" y="429" width="322" height="5" rx="2.5" fill="#e2e1db" opacity="1"/>
  </g>
  <g>
    <text class="seclbl" x="744" y="470">WHAT IS NOT WORKING</text>
    <rect x="1000" y="463" width="322" height="5" rx="2.5" fill="#e2e1db" opacity="1"/>
  </g>
  <g>
    <text class="seclbl" x="744" y="504">WHAT IS NEXT</text>
    <rect x="1000" y="497" width="322" height="5" rx="2.5" fill="#e2e1db" opacity="1"/>
  </g>
  <g>
    <text class="seclbl ask" x="744" y="538">ASK</text>
    <rect x="1000" y="531" width="322" height="5" rx="2.5" fill="#1d4ed8" opacity="0.35"/>
  </g>

  <rect x="0" y="0" width="18" height="600" fill="url(#spine)"/>
</svg>
